<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f6f8" />
  <meta name="color-scheme" content="light" />
  <title>コバファンド 配当ダッシュボード</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #7b8794;
      --border: #e5e7eb;
      --accent: #ef4444;
      --shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Yu Gothic UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: .02em;
    }

    .brand p {
      margin: 5px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border: 1px solid #111827;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(15,23,42,.08);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .file-label.secondary {
      border-color: var(--border);
      background: #fff;
      color: #475569;
      font-weight: 600;
    }

    .file-label:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(15,23,42,.10);
    }

    #portfolioInput, #dividendInput { display: none; }

    .load-info {
      display: grid;
      grid-template-columns: .8fr 1.25fr 1.25fr;
      gap: 0;
      margin-bottom: 18px;
      border: 1px solid rgba(226,232,240,.9);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,.78);
      box-shadow: 0 4px 16px rgba(15,23,42,.035);
    }

    .load-info-item {
      min-width: 0;
      padding: 10px 14px;
      background: rgba(255,255,255,.82);
      border-right: 1px solid #edf0f4;
    }

    .load-info-item:last-child { border-right: 0; }

    .load-info-label {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .03em;
    }

    .load-info-value {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .asset-card {
      padding: 22px 22px 18px;
      min-height: 190px;
      position: relative;
      overflow: hidden;
    }

    .asset-card::after {
      content: "";
      position: absolute;
      right: -45px;
      bottom: -55px;
      width: 150px;
      height: 150px;
      border: 24px solid rgba(239, 68, 68, 0.055);
      border-radius: 50%;
      pointer-events: none;
    }

    .label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: .03em;
    }

    .value-wrap {
      margin-top: 12px;
      display: flex;
      align-items: baseline;
      gap: 4px;
      min-height: 48px;
    }

    .asset-value {
      font-size: clamp(34px, 5vw, 46px);
      font-weight: 760;
      letter-spacing: -0.035em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .yen {
      font-size: 18px;
      font-weight: 700;
      color: #475569;
    }

    .metrics {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      padding: 10px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafafa;
      min-width: 0;
    }

    .metric-label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      white-space: nowrap;
    }

    .metric-value {
      display: block;
      font-size: 15px;
      font-weight: 750;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .positive { color: #dc2626; }
    .negative { color: #2563eb; }
    .neutral { color: #475569; }

    .source {
      margin-top: 19px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .source.warning {
      color: #b45309;
      font-weight: 600;
    }

    .status {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
      min-height: 20px;
    }

    .status.ok { color: #15803d; }
    .status.error { color: #b91c1c; }
    .drop-active {
      outline: 3px solid rgba(239,68,68,.18);
      outline-offset: 3px;
    }

    @media (max-width: 760px) {
      .app { padding: 16px 12px 28px; }

      .topbar {
        align-items: stretch;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 14px;
      }

      .controls {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr;
      }

      .file-label {
        width: 100%;
        min-height: 44px;
      }

      .load-info {
        grid-template-columns: 1fr;
        border-radius: 13px;
        margin-bottom: 14px;
      }

      .load-info-item {
        border-right: 0;
        border-bottom: 1px solid #edf0f4;
        padding: 9px 12px;
      }

      .load-info-item:last-child { border-bottom: 0; }

      .dashboard-grid {
        grid-template-columns: 1fr;
        gap: 11px;
      }

      .card {
        padding: 16px 16px 14px;
        border-radius: 16px;
      }

      .asset-value { font-size: 34px; }
      .metrics { gap: 7px; }
      .metric { padding: 9px; }
      .status { margin-top: 12px; }
    }

    .app-hidden { display: none !important; }

    .auth-gate {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
    }

    .auth-card {
      width: min(420px, 100%);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .auth-card h2 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    .auth-card p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .auth-field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    .auth-field label {
      font-size: 12px;
      font-weight: 700;
      color: #475569;
    }

    .auth-field input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    .auth-button,
    .logout-button {
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .auth-button {
      width: 100%;
      padding: 11px 14px;
      background: #111827;
      color: #fff;
      margin-top: 4px;
    }

    .auth-button:disabled { opacity: .6; cursor: wait; }

    .auth-message {
      min-height: 20px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .auth-message.error { color: #b91c1c; }
    .auth-message.ok { color: #15803d; }

    .session-box {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 11px;
      color: var(--muted);
    }

    .session-user {
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 7px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      color: #475569;
      font-size: 10px;
      font-weight: 700;
    }

    .logout-button {
      padding: 6px 9px;
      border: 1px solid var(--border);
      background: #fff;
      color: #475569;
    }

    @media (max-width: 760px) {
      .session-box {
        justify-content: space-between;
        flex-wrap: wrap;
      }

      .session-user { max-width: 62vw; }
    }

  </style>

  <link rel="manifest" href="./manifest.webmanifest?v=2">
  <link rel="apple-touch-icon" href="./icon-180.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="コバファンド" />

</head>
<body>

  <section id="authGate" class="auth-gate">
    <div class="auth-card">
      <h2>コバファンド</h2>
      <p>夫婦共有ダッシュボードにログインしてください。</p>

      <form id="loginForm">
        <div class="auth-field">
          <label for="loginEmail">メールアドレス</label>
          <input id="loginEmail" type="email" autocomplete="username" required />
        </div>

        <div class="auth-field">
          <label for="loginPassword">パスワード</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required />
        </div>

        <button id="loginButton" class="auth-button" type="submit">ログイン</button>
        <div id="authMessage" class="auth-message"></div>
      </form>
    </div>
  </section>

  <main class="app app-hidden" id="dropArea">
    <div class="topbar">
      <div class="brand">
        <h1>コバファンド</h1>
        <p>配当ダッシュボード Web版</p>
      </div>

      <div>
        <div class="session-box">
          <span id="sessionUser" class="session-user"></span>
          <span id="roleBadge" class="role-badge"></span>
          <button id="logoutButton" class="logout-button" type="button">ログアウト</button>
        </div>

        <div id="editorControls" class="controls">
          <label class="file-label" for="portfolioInput">SBI CSV更新</label>
        <input id="portfolioInput" type="file" accept=".csv,text/csv" />

        <label class="file-label secondary" for="dividendInput">配当マスタ更新（変更時のみ）</label>
          <input id="dividendInput" type="file"
            accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
        </div>
      </div>
    </div>

    <section class="load-info" aria-label="読み込み情報">
      <div class="load-info-item">
        <span class="load-info-label">最終SBI更新</span>
        <span id="lastUpdated" class="load-info-value">未読込</span>
      </div>
      <div class="load-info-item">
        <span class="load-info-label">ポートフォリオCSV</span>
        <span id="portfolioFileName" class="load-info-value">未読込</span>
      </div>
      <div class="load-info-item">
        <span class="load-info-label">配当マスタ</span>
        <span id="dividendMasterInfo" class="load-info-value">未登録</span>
      </div>
    </section>

    <section class="dashboard-grid">
      <article class="card asset-card">
        <div class="label">資産総額</div>
        <div class="value-wrap">
          <span id="assetValue" class="asset-value">---</span>
          <span class="yen">円</span>
        </div>

        <div class="metrics">
          <div class="metric">
            <span class="metric-label">含み損益</span>
            <span id="profitLoss" class="metric-value neutral">---</span>
          </div>
          <div class="metric">
            <span class="metric-label">損益率</span>
            <span id="profitLossRate" class="metric-value neutral">---</span>
          </div>
          <div class="metric">
            <span class="metric-label">前日比</span>
            <span id="dayChange" class="metric-value neutral">---</span>
          </div>
        </div>

        <div id="sourceName" class="source">SBIポートフォリオCSVを読み込んでください</div>
      </article>

      <article class="card asset-card">
        <div class="label">総取得額</div>
        <div class="value-wrap">
          <span id="costValue" class="asset-value">---</span>
          <span class="yen">円</span>
        </div>

        <div class="metrics" style="grid-template-columns: 1fr;">
          <div class="metric">
            <span class="metric-label">現在評価額との差</span>
            <span id="costDifference" class="metric-value neutral">---</span>
          </div>
        </div>

        <div class="source">現在保有分の取得原価</div>
      </article>

      <article class="card asset-card">
        <div class="label">年間配当目安</div>
        <div class="value-wrap">
          <span id="annualDividend" class="asset-value">---</span>
          <span class="yen">円</span>
        </div>

        <div class="metrics" style="grid-template-columns: 1fr 1fr;">
          <div class="metric">
            <span class="metric-label">取得額ベース利回り</span>
            <span id="dividendYieldOnCost" class="metric-value neutral">---</span>
          </div>
          <div class="metric">
            <span class="metric-label">評価額ベース利回り</span>
            <span id="dividendYieldOnValue" class="metric-value neutral">---</span>
          </div>
        </div>

        <div id="dividendStatus" class="source">初回は配当マスタを登録すると自動計算します</div>
      </article>
    </section>

    <div id="status" class="status">
      初回だけ「配当マスタ更新」を行ってください。以後は普段「SBI CSV更新」だけでOKです。
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://kwoymibuevvyowfzulvz.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_kZt0-9bjgsjE5wSoiPP22g_H1quZ2g6';
    const KOBA_USER_ID = '4e7ef675-c563-4ca6-8c40-857b416c0843';
    const DASHBOARD_ROW_ID = 1;

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const DEFAULT_DIVIDEND_MASTER = {};
    const MASTER_STORAGE_KEY = 'kobaDividendMaster_web_v1';
    const MASTER_META_STORAGE_KEY = 'kobaDividendMasterMeta_web_v1';

    const portfolioInput = document.getElementById('portfolioInput');
    const dividendInput = document.getElementById('dividendInput');
    const assetValue = document.getElementById('assetValue');
    const profitLoss = document.getElementById('profitLoss');
    const costValue = document.getElementById('costValue');
    const costDifference = document.getElementById('costDifference');
    const profitLossRate = document.getElementById('profitLossRate');
    const dayChange = document.getElementById('dayChange');
    const sourceName = document.getElementById('sourceName');
    const status = document.getElementById('status');
    const dropArea = document.getElementById('dropArea');
    const annualDividend = document.getElementById('annualDividend');
    const dividendYieldOnCost = document.getElementById('dividendYieldOnCost');
    const dividendYieldOnValue = document.getElementById('dividendYieldOnValue');
    const dividendStatus = document.getElementById('dividendStatus');
    const lastUpdated = document.getElementById('lastUpdated');
    const portfolioFileName = document.getElementById('portfolioFileName');
    const dividendMasterInfo = document.getElementById('dividendMasterInfo');

    const authGate = document.getElementById('authGate');
    const loginForm = document.getElementById('loginForm');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginButton = document.getElementById('loginButton');
    const authMessage = document.getElementById('authMessage');
    const sessionUser = document.getElementById('sessionUser');
    const roleBadge = document.getElementById('roleBadge');
    const logoutButton = document.getElementById('logoutButton');
    const editorControls = document.getElementById('editorControls');

    let currentSession = null;
    let currentUser = null;
    let isEditor = false;
    let currentSummary = null;
    let currentAnnualDividend = null;
    let currentDividendYieldOnCost = null;
    let currentDividendYieldOnValue = null;


    let dividendMaster = { ...DEFAULT_DIVIDEND_MASTER };
    let dividendMasterMeta = {
      source: '未登録',
      count: 0,
      updatedAt: null
    };

    let currentTotalCost = null;
    let currentAssetValue = null;
    let currentHoldings = [];

    restoreDividendMaster();
    refreshMasterInfo();
    initializeAuth();

    portfolioInput.addEventListener('change', async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!isEditor) {
        setStatus('このアカウントは閲覧専用です。', 'error');
        portfolioInput.value = '';
        return;
      }
      try {
        await loadPortfolio(file);
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'SBI CSVの読み込みに失敗しました。', 'error');
      } finally {
        portfolioInput.value = '';
      }
    });

    dividendInput.addEventListener('change', async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!isEditor) {
        setStatus('このアカウントは閲覧専用です。', 'error');
        dividendInput.value = '';
        return;
      }

      try {
        await updateDividendMasterFromExcel(file);
        recalculateDividend();
        if (currentHoldings.length) {
          await saveDashboardToCloud();
        }
        setStatus(`配当マスタを更新しました：${file.name}`, 'ok');
      } catch (error) {
        console.error(error);
        setStatus(error.message || '配当マスタの更新に失敗しました。', 'error');
      } finally {
        dividendInput.value = '';
      }
    });

    ['dragenter', 'dragover'].forEach(type => {
      dropArea.addEventListener(type, e => {
        e.preventDefault();
        dropArea.classList.add('drop-active');
      });
    });

    ['dragleave', 'drop'].forEach(type => {
      dropArea.addEventListener(type, e => {
        e.preventDefault();
        dropArea.classList.remove('drop-active');
      });
    });

    dropArea.addEventListener('drop', async e => {
      if (!isEditor) {
        setStatus('このアカウントは閲覧専用です。', 'error');
        return;
      }

      const files = [...(e.dataTransfer?.files || [])];
      if (!files.length) return;

      const csv = files.find(f => f.name.toLowerCase().endsWith('.csv'));
      const xlsx = files.find(f => f.name.toLowerCase().endsWith('.xlsx'));

      try {
        if (xlsx) await updateDividendMasterFromExcel(xlsx);
        if (csv) await loadPortfolio(csv);

        if (!csv && !xlsx) {
          setStatus('CSVまたは配当マスタExcelをドロップしてください。', 'error');
        }
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'ファイルの読み込みに失敗しました。', 'error');
      }
    });

    async function loadPortfolio(file) {
      setStatus('SBI CSVを読み込んでいます…');

      const buffer = await file.arrayBuffer();
      const text = decodeCsv(buffer);
      const rows = parseCsv(text);
      const summary = findGrandTotal(rows);
      const holdings = extractStockHoldings(rows);

      if (!summary || summary.asset === null) {
        throw new Error('「総合計」を見つけられませんでした。SBIポートフォリオCSVか確認してください。');
      }

      if (!holdings.length) {
        throw new Error('保有株式を読み取れませんでした。SBIポートフォリオCSVか確認してください。');
      }

      currentHoldings = holdings;
      currentAssetValue = summary.asset;
      currentTotalCost =
        summary.profitLoss === null
          ? null
          : summary.asset - summary.profitLoss;

      assetValue.textContent = Math.round(summary.asset).toLocaleString('ja-JP');
      costValue.textContent =
        currentTotalCost === null
          ? '---'
          : Math.round(currentTotalCost).toLocaleString('ja-JP');

      setMetric(costDifference, summary.profitLoss, '円');
      setMetric(profitLoss, summary.profitLoss, '円');
      setMetric(profitLossRate, summary.profitLossRate, '%', 2);
      setMetric(dayChange, summary.dayChange, '円');

      sourceName.textContent = file.name;
      portfolioFileName.textContent = file.name;
      portfolioFileName.title = file.name;

      lastUpdated.textContent = formatDateTime(new Date());

      currentSummary = summary;
      recalculateDividend();

      const cloudSaved = await saveDashboardToCloud();

      setStatus(
        cloudSaved
          ? `SBI CSV更新＋共有データ更新完了：${holdings.length}銘柄 / 評価額 ${summary.asset.toLocaleString('ja-JP', {maximumFractionDigits: 2})}円`
          : `SBI CSV更新完了：${holdings.length}銘柄 / 評価額 ${summary.asset.toLocaleString('ja-JP', {maximumFractionDigits: 2})}円（共有データは未更新）`,
        cloudSaved ? 'ok' : ''
      );
    }

    function extractStockHoldings(rows) {
      const holdings = [];

      for (const row of rows) {
        const first = String(row[0] ?? '').trim();
        const match = first.match(/^(\d{4})\s+(.+)$/);
        if (!match) continue;

        const quantity = toNumber(row[2]);
        if (quantity === null || quantity <= 0) continue;

        holdings.push({
          code: match[1],
          name: match[2].trim(),
          quantity
        });
      }

      return holdings;
    }

    function recalculateDividend() {
      if (!Object.keys(dividendMaster).length) {
        currentAnnualDividend = null;
        currentDividendYieldOnCost = null;
        currentDividendYieldOnValue = null;
        annualDividend.textContent = '---';
        dividendYieldOnCost.textContent = '---';
        dividendYieldOnValue.textContent = '---';
        dividendStatus.textContent = '配当マスタ未登録：初回だけ「配当マスタ更新」を行ってください';
        dividendStatus.className = 'source warning';
        return;
      }

      if (!currentHoldings.length) {
        currentAnnualDividend = null;
        currentDividendYieldOnCost = null;
        currentDividendYieldOnValue = null;
        annualDividend.textContent = '---';
        dividendYieldOnCost.textContent = '---';
        dividendYieldOnValue.textContent = '---';
        dividendStatus.textContent = 'SBI CSV読込後に自動計算します';
        dividendStatus.className = 'source';
        return;
      }

      const missing = [];
      let total = 0;

      for (const holding of currentHoldings) {
        const master = dividendMaster[holding.code];
        const perShare = master ? Number(master.dividend) : NaN;

        if (!Number.isFinite(perShare)) {
          missing.push(`${holding.code} ${holding.name}`);
          continue;
        }

        total += holding.quantity * perShare;
      }

      if (missing.length) {
        currentAnnualDividend = null;
        currentDividendYieldOnCost = null;
        currentDividendYieldOnValue = null;
        annualDividend.textContent = '---';
        dividendYieldOnCost.textContent = '---';
        dividendYieldOnValue.textContent = '---';
        dividendStatus.textContent =
          `配当マスタ未登録：${missing.join(' / ')}`;
        dividendStatus.className = 'source warning';
        return;
      }

      currentAnnualDividend = total;
      currentDividendYieldOnCost =
        Number.isFinite(currentTotalCost) && currentTotalCost > 0
          ? (total / currentTotalCost * 100)
          : null;
      currentDividendYieldOnValue =
        Number.isFinite(currentAssetValue) && currentAssetValue > 0
          ? (total / currentAssetValue * 100)
          : null;

      annualDividend.textContent = total.toLocaleString('ja-JP', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });

      dividendYieldOnCost.textContent =
        Number.isFinite(currentDividendYieldOnCost)
          ? `${currentDividendYieldOnCost.toFixed(2)}%`
          : '---';

      dividendYieldOnValue.textContent =
        Number.isFinite(currentDividendYieldOnValue)
          ? `${currentDividendYieldOnValue.toFixed(2)}%`
          : '---';

      dividendStatus.textContent =
        `SBI保有株数 × 配当マスタ1株配当 / ${currentHoldings.length}銘柄`;
      dividendStatus.className = 'source';
    }

    async function updateDividendMasterFromExcel(file) {
      const buffer = await file.arrayBuffer();
      const rows = await readSimpleXlsxFirstSheet(buffer);
      const nextMaster = {};

      for (const row of rows) {
        const code = String(row[0] ?? '').trim();
        if (!/^\d{4}$/.test(code)) continue;

        const name = String(row[1] ?? '').trim();
        const dividend = toNumber(row[3]);  // D列だけ使用。E列の保有株数は完全に無視。

        if (dividend === null) continue;

        nextMaster[code] = {
          name,
          dividend
        };
      }

      const count = Object.keys(nextMaster).length;
      if (!count) {
        throw new Error('配当マスタを読み取れませんでした。A列=銘柄コード、D列=1株配当を確認してください。');
      }

      dividendMaster = nextMaster;
      dividendMasterMeta = {
        source: file.name,
        count,
        updatedAt: new Date().toISOString()
      };

      let persisted = true;
      try {
        localStorage.setItem(MASTER_STORAGE_KEY, JSON.stringify(dividendMaster));
        localStorage.setItem(MASTER_META_STORAGE_KEY, JSON.stringify(dividendMasterMeta));
      } catch (error) {
        console.warn('配当マスタをブラウザ保存できませんでした。', error);
        persisted = false;
      }

      refreshMasterInfo();

      if (!persisted) {
        setStatus('配当マスタは今回の画面には反映しましたが、ブラウザへの保存に失敗しました。', 'error');
      }
    }

    function restoreDividendMaster() {
      try {
        const saved = localStorage.getItem(MASTER_STORAGE_KEY);
        const meta = localStorage.getItem(MASTER_META_STORAGE_KEY);

        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && typeof parsed === 'object' && Object.keys(parsed).length) {
            dividendMaster = parsed;
          }
        }

        if (meta) {
          const parsedMeta = JSON.parse(meta);
          if (parsedMeta && typeof parsedMeta === 'object') {
            dividendMasterMeta = parsedMeta;
          }
        }

        if (!Object.keys(dividendMaster).length) {
          dividendMasterMeta = { source: '未登録', count: 0, updatedAt: null };
        }
      } catch (error) {
        console.warn('保存済み配当マスタの復元に失敗しました。', error);
        dividendMaster = {};
        dividendMasterMeta = { source: '未登録', count: 0, updatedAt: null };
      }
    }

    function refreshMasterInfo() {
      const count = Object.keys(dividendMaster).length;

      if (!count) {
        dividendMasterInfo.textContent = '未登録';
        dividendMasterInfo.title = '初回のみ配当マスタExcelを読み込んでください';
        return;
      }

      const source = dividendMasterMeta.source || '保存済み配当マスタ';
      dividendMasterInfo.textContent = `${source} / ${count}銘柄`;
      dividendMasterInfo.title = dividendMasterMeta.updatedAt
        ? `${source} / 更新 ${formatDateTime(new Date(dividendMasterMeta.updatedAt))}`
        : `${source} / ${count}銘柄`;
    }


    async function initializeAuth() {
      loginForm.addEventListener('submit', handleLogin);
      logoutButton.addEventListener('click', handleLogout);

      const { data, error } = await supabaseClient.auth.getSession();

      if (error) {
        console.error(error);
        showLoggedOut('ログイン状態を確認できませんでした。');
        return;
      }

      await handleSession(data.session);

      supabaseClient.auth.onAuthStateChange((_event, session) => {
        setTimeout(() => handleSession(session), 0);
      });
    }

    async function handleLogin(event) {
      event.preventDefault();

      const email = loginEmail.value.trim();
      const password = loginPassword.value;
      if (!email || !password) return;

      loginButton.disabled = true;
      setAuthMessage('ログインしています…');

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      loginButton.disabled = false;

      if (error) {
        console.error(error);
        setAuthMessage('メールアドレスまたはパスワードを確認してください。', 'error');
        return;
      }

      loginPassword.value = '';
      setAuthMessage('ログインしました。', 'ok');
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
    }

    async function handleSession(session) {
      currentSession = session;
      currentUser = session?.user ?? null;
      isEditor = currentUser?.id === KOBA_USER_ID;

      if (!currentUser) {
        showLoggedOut();
        return;
      }

      authGate.classList.add('app-hidden');
      dropArea.classList.remove('app-hidden');

      sessionUser.textContent = currentUser.email || currentUser.id;
      roleBadge.textContent = isEditor ? '更新担当' : '閲覧専用';
      editorControls.style.display = isEditor ? '' : 'none';

      await loadDashboardFromCloud();
    }

    function showLoggedOut(message = '') {
      currentSession = null;
      currentUser = null;
      isEditor = false;

      authGate.classList.remove('app-hidden');
      dropArea.classList.add('app-hidden');
      editorControls.style.display = 'none';

      if (message) setAuthMessage(message, 'error');
      else setAuthMessage('');
    }

    function setAuthMessage(message, type = '') {
      authMessage.textContent = message;
      authMessage.className = `auth-message ${type}`.trim();
    }

    async function loadDashboardFromCloud() {
      setStatus('共有データを読み込んでいます…');

      const { data: row, error } = await supabaseClient
        .from('dashboard_current')
        .select('id,data,updated_at')
        .eq('id', DASHBOARD_ROW_ID)
        .single();

      if (error) {
        console.error(error);
        setStatus('共有データを読み込めませんでした。ログイン権限または通信状態を確認してください。', 'error');
        return;
      }

      const data = row?.data;

      if (!data || typeof data !== 'object' || !Number.isFinite(Number(data.assetValue))) {
        setStatus(
          isEditor
            ? '共有データはまだテスト状態です。配当マスタを登録後、SBI CSVを読み込んで最初の共有更新を行ってください。'
            : '共有ダッシュボードはまだ準備中です。',
          ''
        );
        return;
      }

      applyCloudDashboard(data, row.updated_at);
      setStatus(
        isEditor
          ? '共有データを読み込みました。SBI CSV更新で最新値を共有できます。'
          : '最新の共有データを表示しています。',
        'ok'
      );
    }

    function applyCloudDashboard(data, rowUpdatedAt) {
      const asset = toFiniteNumber(data.assetValue);
      const totalCost = toFiniteNumber(data.totalCost);
      const profit = toFiniteNumber(data.profitLoss);
      const profitRate = toFiniteNumber(data.profitLossRate);
      const day = toFiniteNumber(data.dayChange);
      const dividend = toFiniteNumber(data.annualDividend);
      const yoc = toFiniteNumber(data.dividendYieldOnCost);
      const yov = toFiniteNumber(data.dividendYieldOnValue);

      currentAssetValue = asset;
      currentTotalCost = totalCost;
      currentAnnualDividend = dividend;
      currentDividendYieldOnCost = yoc;
      currentDividendYieldOnValue = yov;

      assetValue.textContent =
        Number.isFinite(asset) ? Math.round(asset).toLocaleString('ja-JP') : '---';

      costValue.textContent =
        Number.isFinite(totalCost) ? Math.round(totalCost).toLocaleString('ja-JP') : '---';

      setMetric(costDifference, profit, '円');
      setMetric(profitLoss, profit, '円');
      setMetric(profitLossRate, profitRate, '%', 2);
      setMetric(dayChange, day, '円');

      annualDividend.textContent =
        Number.isFinite(dividend)
          ? dividend.toLocaleString('ja-JP', {minimumFractionDigits: 0, maximumFractionDigits: 2})
          : '---';

      dividendYieldOnCost.textContent =
        Number.isFinite(yoc) ? `${yoc.toFixed(2)}%` : '---';

      dividendYieldOnValue.textContent =
        Number.isFinite(yov) ? `${yov.toFixed(2)}%` : '---';

      const portfolioName = data.portfolioFileName || '共有データ';
      portfolioFileName.textContent = portfolioName;
      portfolioFileName.title = portfolioName;
      sourceName.textContent = portfolioName;

      const updated = data.lastUpdated || rowUpdatedAt;
      lastUpdated.textContent = updated ? formatDateTime(new Date(updated)) : '---';

      const masterSource = data.dividendMasterSource || '共有済み配当マスタ';
      const masterCount = Number(data.dividendMasterCount || 0);
      dividendMasterInfo.textContent =
        masterCount > 0 ? `${masterSource} / ${masterCount}銘柄` : masterSource;

      const holdingsCount = Number(data.holdingsCount || 0);
      dividendStatus.textContent =
        holdingsCount > 0 ? `共有データ / ${holdingsCount}銘柄` : '共有データ';
      dividendStatus.className = 'source';
    }

    async function saveDashboardToCloud() {
      if (!isEditor || !currentUser) return false;

      if (
        !currentSummary ||
        !Number.isFinite(currentAssetValue) ||
        !Number.isFinite(currentTotalCost) ||
        !Number.isFinite(currentAnnualDividend)
      ) {
        return false;
      }

      const payload = {
        version: 1,
        assetValue: currentAssetValue,
        totalCost: currentTotalCost,
        profitLoss: currentSummary.profitLoss,
        profitLossRate: currentSummary.profitLossRate,
        dayChange: currentSummary.dayChange,
        annualDividend: currentAnnualDividend,
        dividendYieldOnCost: currentDividendYieldOnCost,
        dividendYieldOnValue: currentDividendYieldOnValue,
        lastUpdated: new Date().toISOString(),
        portfolioFileName: portfolioFileName.textContent || '',
        dividendMasterSource: dividendMasterMeta.source || '配当マスタ',
        dividendMasterCount: Object.keys(dividendMaster).length,
        holdingsCount: currentHoldings.length
      };

      const now = new Date().toISOString();

      const { data: updatedRow, error } = await supabaseClient
        .from('dashboard_current')
        .update({ data: payload, updated_at: now })
        .eq('id', DASHBOARD_ROW_ID)
        .select('id,updated_at')
        .single();

      if (error || !updatedRow) {
        console.error(error || new Error('更新対象行がありません。'));
        setStatus('ローカル計算は完了しましたが、共有データの更新に失敗しました。', 'error');
        return false;
      }

      return true;
    }

    function toFiniteNumber(value) {
      if (value === null || value === undefined || value === '') return null;
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function decodeCsv(buffer) {
      try {
        return new TextDecoder('shift_jis').decode(buffer);
      } catch (_) {
        return new TextDecoder('utf-8').decode(buffer);
      }
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (ch === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          row.push(cell.trim());
          cell = '';
        } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && next === '\n') i++;
          row.push(cell.trim());
          cell = '';
          if (row.some(v => v !== '')) rows.push(row);
          row = [];
        } else {
          cell += ch;
        }
      }

      if (cell.length || row.length) {
        row.push(cell.trim());
        if (row.some(v => v !== '')) rows.push(row);
      }

      return rows;
    }

    function findGrandTotal(rows) {
      for (let i = 0; i < rows.length; i++) {
        const first = normalize(rows[i][0]);

        if (first === '総合計') {
          for (let j = i + 1; j < Math.min(i + 5, rows.length); j++) {
            const maybeHeader = rows[j].map(normalize);

            if (maybeHeader[0] === '評価額') {
              const valueRow = rows[j + 1];
              if (!valueRow) return null;

              return {
                asset: toNumber(valueRow[0]),
                profitLoss: toNumber(valueRow[1]),
                profitLossRate: toNumber(valueRow[2]),
                dayChange: toNumber(valueRow[3]),
                dayChangeRate: toNumber(valueRow[4])
              };
            }
          }
        }
      }

      return null;
    }

    function setMetric(element, value, suffix, decimals = 0) {
      if (value === null || value === undefined || !Number.isFinite(value)) {
        element.textContent = '---';
        element.className = 'metric-value neutral';
        return;
      }

      const sign = value > 0 ? '+' : '';
      const formatted = value.toLocaleString('ja-JP', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });

      element.textContent = `${sign}${formatted}${suffix}`;
      element.className =
        `metric-value ${value > 0 ? 'positive' : value < 0 ? 'negative' : 'neutral'}`;
    }

    function normalize(value = '') {
      return String(value)
        .replace(/^\uFEFF/, '')
        .replace(/\s+/g, '')
        .trim();
    }

    function toNumber(value) {
      if (value == null) return null;

      const cleaned = String(value)
        .replace(/,/g, '')
        .replace(/円/g, '')
        .trim();

      if (!cleaned || cleaned === '--') return null;

      const num = Number(cleaned);
      return Number.isFinite(num) ? num : null;
    }

    function formatDateTime(date) {
      return new Intl.DateTimeFormat('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      }).format(date);
    }

    // ---- Minimal XLSX reader (offline / first worksheet only) ----
    async function readSimpleXlsxFirstSheet(arrayBuffer) {
      const zip = new Uint8Array(arrayBuffer);
      const entries = parseZipEntries(zip);

      const sheetName =
        entries.has('xl/worksheets/sheet1.xml')
          ? 'xl/worksheets/sheet1.xml'
          : [...entries.keys()].find(name => /^xl\/worksheets\/sheet\d+\.xml$/.test(name));

      if (!sheetName) throw new Error('Excel内にワークシートが見つかりません。');

      let sharedStrings = [];

      if (entries.has('xl/sharedStrings.xml')) {
        const sharedXml = await unzipText(zip, entries.get('xl/sharedStrings.xml'));
        sharedStrings = parseSharedStrings(sharedXml);
      }

      const sheetXml = await unzipText(zip, entries.get(sheetName));
      return parseWorksheet(sheetXml, sharedStrings);
    }

    function parseZipEntries(bytes) {
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      let eocd = -1;
      const min = Math.max(0, bytes.length - 65557);

      for (let i = bytes.length - 22; i >= min; i--) {
        if (view.getUint32(i, true) === 0x06054b50) {
          eocd = i;
          break;
        }
      }

      if (eocd < 0) throw new Error('ExcelファイルのZIP構造を読み取れません。');

      const centralDirSize = view.getUint32(eocd + 12, true);
      const centralDirOffset = view.getUint32(eocd + 16, true);
      const entries = new Map();
      const decoder = new TextDecoder('utf-8');

      let p = centralDirOffset;
      const end = centralDirOffset + centralDirSize;

      while (p < end) {
        if (view.getUint32(p, true) !== 0x02014b50) break;

        const compression = view.getUint16(p + 10, true);
        const compressedSize = view.getUint32(p + 20, true);
        const uncompressedSize = view.getUint32(p + 24, true);
        const fileNameLength = view.getUint16(p + 28, true);
        const extraLength = view.getUint16(p + 30, true);
        const commentLength = view.getUint16(p + 32, true);
        const localHeaderOffset = view.getUint32(p + 42, true);

        const nameBytes = bytes.slice(p + 46, p + 46 + fileNameLength);
        const name = decoder.decode(nameBytes);

        entries.set(name, {
          compression,
          compressedSize,
          uncompressedSize,
          localHeaderOffset
        });

        p += 46 + fileNameLength + extraLength + commentLength;
      }

      return entries;
    }

    async function unzipText(zipBytes, entry) {
      const view = new DataView(zipBytes.buffer, zipBytes.byteOffset, zipBytes.byteLength);
      const p = entry.localHeaderOffset;

      if (view.getUint32(p, true) !== 0x04034b50) {
        throw new Error('Excel内ファイルのヘッダーを読み取れません。');
      }

      const fileNameLength = view.getUint16(p + 26, true);
      const extraLength = view.getUint16(p + 28, true);
      const dataStart = p + 30 + fileNameLength + extraLength;
      const compressed = zipBytes.slice(dataStart, dataStart + entry.compressedSize);

      let raw;

      if (entry.compression === 0) {
        raw = compressed;
      } else if (entry.compression === 8) {
        if (typeof DecompressionStream === 'undefined') {
          throw new Error('このブラウザはExcel展開機能に対応していません。Chrome / Edgeで開いてください。');
        }

        const stream = new Blob([compressed])
          .stream()
          .pipeThrough(new DecompressionStream('deflate-raw'));

        raw = new Uint8Array(await new Response(stream).arrayBuffer());
      } else {
        throw new Error(`未対応のExcel圧縮方式です (${entry.compression})。`);
      }

      return new TextDecoder('utf-8').decode(raw);
    }

    function parseSharedStrings(xmlText) {
      const doc = new DOMParser().parseFromString(xmlText, 'application/xml');

      return [...doc.getElementsByTagName('si')].map(si =>
        [...si.getElementsByTagName('t')]
          .map(t => t.textContent ?? '')
          .join('')
      );
    }

    function parseWorksheet(xmlText, sharedStrings) {
      const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
      const output = [];

      for (const rowEl of doc.getElementsByTagName('row')) {
        const row = [];

        for (const cell of rowEl.getElementsByTagName('c')) {
          const ref = cell.getAttribute('r') || '';
          const colLetters = (ref.match(/[A-Z]+/i) || ['A'])[0].toUpperCase();
          const colIndex = lettersToColumnIndex(colLetters);
          const type = cell.getAttribute('t');

          let value = null;

          if (type === 'inlineStr') {
            const t = cell.getElementsByTagName('t')[0];
            value = t ? t.textContent : '';
          } else {
            const v = cell.getElementsByTagName('v')[0];
            const raw = v ? v.textContent : '';

            if (type === 's') {
              value = sharedStrings[Number(raw)] ?? '';
            } else if (type === 'str') {
              value = raw;
            } else if (raw !== '') {
              const n = Number(raw);
              value = Number.isFinite(n) ? n : raw;
            }
          }

          row[colIndex] = value;
        }

        output.push(row);
      }

      return output;
    }

    function lettersToColumnIndex(letters) {
      let n = 0;

      for (const ch of letters) {
        n = n * 26 + (ch.charCodeAt(0) - 64);
      }

      return n - 1;
    }

    function setStatus(message, type = '') {
      status.textContent = message;
      status.className = `status ${type}`.trim();
    }
  </script>
